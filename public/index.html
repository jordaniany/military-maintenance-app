<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="refresh" content="1; url=https://military-maintenance-app.streamlit.app">
  <meta name="description" content="منظومة إدارة القوى البشرية ومرتبات مفارز صيانة المستشفيات العسكرية بالمحافظات - شعبة صيانة المستشفيات العسكرية">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="صيانة المستشفيات">
  <meta name="theme-color" content="#0F172A">
  <title>شعبة صيانة المستشفيات العسكرية | فرع صيانة المستشفيات العسكرية</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
      direction: rtl;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #FFFFFF;
    }
    
    .portal-card {
      width: 90%;
      max-width: 480px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.6s ease-out;
    }
    
    .emblem {
      font-size: 58px;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5));
      animation: pulse 2s infinite ease-in-out;
    }
    
    .title {
      font-size: 22px;
      font-weight: 900;
      color: #F8FAFC;
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }
    
    .subtitle {
      font-size: 14.5px;
      font-weight: 600;
      color: #94A3B8;
      margin-bottom: 20px;
    }
    
    .badge {
      display: inline-block;
      background: rgba(21, 128, 61, 0.25);
      border: 1px solid #16A34A;
      color: #86EFAC;
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
    }
    
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top: 4px solid #38BDF8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }
    
    .status-text {
      font-size: 13.5px;
      color: #CBD5E1;
      font-weight: 600;
    }
    
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: linear-gradient(135deg, #1E40AF 0%, #0284C7 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      padding: 14px 24px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6);
      background: linear-gradient(135deg, #1D4ED8 0%, #0369A1 100%);
    }
    
    .action-btn:active {
      transform: translateY(0);
    }
    
    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="portal-card">
    <div class="emblem">🛡️ ⚙️ 🏥</div>
    <div class="title">شعبة صيانة المستشفيات العسكرية</div>
    <div class="subtitle">فرع صيانة المستشفيات العسكرية</div>
    <div class="badge">النسخة السحابية المحدثة 2026</div>
    
    <div class="loader-container">
      <div class="spinner"></div>
      <div id="status-msg" class="status-text">جاري تحويلك تلقائياً إلى المنظومة المركزية...</div>
    </div>
    
    <a id="launch-btn" class="action-btn" href="https://military-maintenance-app.streamlit.app">
      <span>🚀</span>
      <span>الدخول المباشر إلى المنظومة</span>
    </a>
    
    <div class="footer-note">
      المنظومة مؤمنة وتعمل على مدار الساعة بتزامن كامل
    </div>
  </div>

  <script>
    const TARGET_URL = "https://military-maintenance-app.streamlit.app";
    
    // التحويل التلقائي المباشر وفوراً بدون نافذة إطار محظورة
    try {
      window.location.replace(TARGET_URL);
    } catch(e) {
      window.location.href = TARGET_URL;
    }
    
    // تسجيل الـ Service Worker لتمكين تثبيت التطبيق PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {});
      });
    }
  </script>
</body>
</html>
